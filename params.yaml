data:
  raw_train: data/raw/train.csv
  raw_later: data/raw/later.csv
  raw_holdout: data/raw/holdout_features.csv
  target: delay_min
  group_col: depot_zone
  date_col: date
checks:
  sentinel_candidates: [-1, -999, 999, 9999, -9999]
  unit_factors: [10, 12, 60, 100, 1000]
  unit_tolerance: 0.15
  stuck_min_run: 10
  typo_gap_ratio: 3.0
train:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp125-bus-delay
  registered_model_name: mp125-delay-model
  model_path: models/model.joblib
  train_fraction: 0.8
  seed: 42
  settings:
    - name: rf_small
      kind: random_forest
      params: {n_estimators: 50, max_depth: 5}
    - name: rf_large
      kind: random_forest
      params: {n_estimators: 200, max_depth: 10}
    - name: gbr_default
      kind: gradient_boosting
      params: {n_estimators: 150, learning_rate: 0.05, max_depth: 3}
