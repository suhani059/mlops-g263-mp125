# MP125 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G263"          # your group id, e.g. "G042"
problem_id: "MP125"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: false
    column: null           # the column recorded in a different unit
    group_value: null      # the value of depot_zone whose rows are affected
    factor: null           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: hour
    value: 9999            # the special number typed instead of a blank
    count: 55            # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: driver_exp_yr
    start_date: "2026-03-29"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-19"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 12            # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: weather
    true_levels: 3      # how many real categories there are after cleaning

tracking:
  experiment_name: "mp125-bus-delay"
  best_run_id: "ddd75823c6de4e35b3d718883e5d01fd"        # the MLflow run id of your v1 model
  registered_model_name: "mp125-delay-model"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    route_km: 0.0185
    stops: 3.3675
    passengers: 0.0491
    hour: 0.0481
    temp_c: 0.0346
    driver_exp_yr: 0.0213
  most_drifted_feature: "stops"
  mae_by_group:            # v1 on later.csv, per value of depot_zone
    'North': 8.9449
    'South': 3.1934
    'East': 3.8219
  worst_served_group: "North"
  mae_v1_on_check: 4.3113   # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 1.8757   # v2 on the same rows
  decision: "promote"   # promote or keep
